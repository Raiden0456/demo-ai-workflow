name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: vars.AI_REVIEWER == 'claude' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.ref }}

            You are the first-pass reviewer. A human approval is still required to merge.
            The PR branch is checked out. Read CLAUDE.md and REVIEW.md, then review
            `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD` against that checklist.

            Post each finding as an inline comment with `mcp__github_inline_comment__create_inline_comment`
            (confirmed: true), prefixed with its severity. Then post one summary with `gh pr comment`:
            findings count by severity and a verdict of "Ready for human review" or "Changes requested".
            Never approve the PR.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Read,Grep,Glob"
